name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10

      - run: |
          unzip -o ALFIII-XFHD-Native-Source.zip
          cd ALFIII-XFHD-Native
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ALFIII-XFHD-APK
          path: ALFIII-XFHD-Native/app/build/outputs/apk/debug/app-debug.apk
